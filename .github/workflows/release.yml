name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# This fork has no ruleset on `main`, so the built-in GITHUB_TOKEN can push the
# `chore(release)` commit and tag itself — no GitHub App, no bypass actor.
# `contents: write` covers the push, the tag and the GitHub release;
# `issues` / `pull-requests: write` cover the comments @semantic-release/github
# posts. `id-token: write` is what NPM Trusted Publishing exchanges for its
# OIDC credential.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The npm Trusted Publisher is bound to this environment, so only a run
    # that names it can mint an npm OIDC credential. Restrict its deployment
    # branch policy to `main` (Settings -> Environments) to keep it that way.
    environment: release
    # The whole pipeline runs in about a minute. A wedged step should fail
    # rather than hold the runner for the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the tooling Node version: .nvmrc.
          # ci.yml uses the same file. Node 20 compatibility (the floor
          # declared in package.json#engines.node) is verified by the
          # `smoke-node20` job in ci.yml, which installs the packed tarball
          # on Node 20 and runs the smoke test.
          node-version-file: .nvmrc
          cache: pnpm
          # No `registry-url`: with NPM Trusted Publishing, the OIDC exchange
          # happens inside @semantic-release/npm. Letting setup-node write
          # an ~/.npmrc with an `_authToken=${NODE_AUTH_TOKEN}` placeholder
          # would either require us to re-introduce NPM_TOKEN or break the
          # pre-publish `npm whoami` check.

      - name: Upgrade npm to a version that supports OIDC Trusted Publishing
        # Full Trusted Publishing OIDC (publish without NPM_TOKEN, using
        # only id-token: write) needs npm >= 11.5.1. @semantic-release/npm
        # shells out to the npm CLI, so it is the global npm version that
        # matters here. Kept as a defensive upgrade even when the Node
        # release bundles a newer npm — it's a no-op if already satisfied.
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: node scripts/smoke-test.mjs

      - run: pnpm exec semantic-release
        env:
          # Authenticates both the `git push HEAD:main` of @semantic-release/git
          # and the GitHub release + issue comments of @semantic-release/github.
          # A push made with the built-in GITHUB_TOKEN starts no workflow run,
          # so the release commit cannot re-trigger Release; the `[skip ci]` in
          # its message (asserted by tests/unit/releaserc-skip-ci.test.ts) stays
          # as a second guard should this ever move back to an App token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth to npm is via NPM Trusted Publishing (OIDC), configured on
          # npmjs.com against this workflow file. The `id-token: write`
          # permission above is all that's needed — no NPM_TOKEN secret.
          # Verbose logging so the next failure is debuggable from the run
          # log alone (the OIDC publish step previously exit-1'd without
          # surfacing the actual npm error).
          DEBUG: 'semantic-release:*'
          NPM_CONFIG_LOGLEVEL: verbose
